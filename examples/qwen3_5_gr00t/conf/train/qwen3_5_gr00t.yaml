system:
  batch_size: 4
  train_steps: 150000
  log_freq: 1
  grad_clip_norm: 1.0
  use_amp: true
  shuffle: true
  num_workers: 16
  vlm_loss_scale: 0.1

  checkpoint:
    output_directory: ${experiment.exp_dir}
    save_checkpoint: true
    save_freq: 10000

  activation_checkpoint:
    # mode: none
    mode: full
    # selective_ac_option: "op"
    # preserve_rng_state: true
    # memory_budget: 0.5
    # checkpoint_patterns:
    #   - "vlm\\.model\\.model\\.language_model\\.layers\\.\\d+"
    #   - "action_model\\._head\\.model\\.transformer_blocks\\.\\d+"

model:
  model_name: qwen3_5_gr00t
  vlm:
    type: qwen3.5-vl
    base_vlm: /share/project/wangyihao/starVLA/playground/Model/Qwen3.5-4B/
    attn_implementation: flash_attention_2
  action_model:
    use_state: false
    type: gr00t_dynamic_action_head
    action_model_type: DiT-B
    hidden_size: 1024
    add_pos_embed: True
    max_seq_len: 1024
    action_dim: 7
    state_dim: 7
    future_action_window_size: 7
    action_horizon: 8
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      cross_attention_dim: 2560
      dropout: 0.2
      final_dropout: True
      interleave_self_attention: True
      norm_type: ada_norm
      num_layers: 16
      output_dim: 1024
      positional_embeddings: None

  # chunked_ce_tokens: 128
  chunked_ce_tokens: 0

  # NFP (Next Frame Prediction) head
  nfp:
    vl_hidden_dim: 2560
    expand_ratio: 4
    depth: 2
    dropout: 0.0
    vlm_feature_layer: -1
    nfp_loss_mse_weight: 0.1
    nfp_loss_cosine_weight: 1.0
    image_token_id: 248056  # Qwen3.5-VL

  # Set to false for Stage 1 (only train NFP + VLM language, no action loss)
  use_action_policy_loss: false

  prompt_template: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."

  normalization_mapping:
    VISUAL: IDENTITY
    STATE: IDENTITY
    ACTION: IDENTITY

  optimizer:
    name: AdamW
    lr: 2.5e-5
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
    param_groups:
      vlm:
        lr: 1.0e-05
      action_model:
        lr: 1.0e-04
    scheduler:
      name: cosine_with_min_lr
      warmup_steps: 500
      scheduler_kwargs:
        min_lr: 1.0e-06

  # ============================================================
  # Module Freezing Configuration
  # ============================================================
  # Stage 1 (NFP pre-training): freeze action_model + visual encoder
  freeze:
    freeze_patterns:
      - "action_model\\..*"
      - "vlm\\.model\\.model\\.visual\\..*"

data:
  dataset_type: lerobot
  # Future frame offset (in steps) for NFP training.
  # Set to null to disable NFP future image fetching.
  future_offset: 1
  wds:
    vision_root: ""
    action_key: eepose
    state_key: eepose
  data_path: ""  # unused when data_mix is set; empty string to satisfy pydantic str type
  tolerance_s: 0.02

  # Multi-dataset mixture (set data_mix to use, or leave null for single dataset via data_path)
  data_mix: ego1
  data_root_dir: /share/project/hotel/lerobot30_multiimage_data_1fps
  balance_dataset_weights: true
  preprocessor:
    name: policy_preprocessor
    steps:
      - registry_name: rename_observations_processor
        config:
          rename_map: {}
      - registry_name: to_batch_processor
        config: {}
      - registry_name: device_processor
        config:
          device: cuda
          float_dtype: null
      - registry_name: normalizer_processor
        config:
          eps: 1e-8
          features: {}
  postprocessor:
    name: policy_postprocessor
    steps:
      - registry_name: unnormalizer_processor
        config:
          eps: 1e-8
          features: {}

  # VLM co-training data (uncomment to enable)
  vlm_data:
    # vlm_data_root: /nfs/zhangqq/datasets/lerobot/vlm_data
    # video_data_root: /nfs/zhangqq/datasets/lerobot/vlm_data
    # image_root: /nfs/zhangqq/datasets/lerobot/vlm_data
    vlm_data_root: /share/project/wangyihao/starVLA/playground/Datasets/VLM_DATA
    video_data_root: /share/project/mycao/web_video_train
    image_root: /share/project/mycao/robobrain_v2_5_sz
    dataset_use: all   # original; honeydata excluded below to test OOM hypothesis (max_img=12 outliers)
    # dataset_use: llavav15_lrv,activitynetqa_0_30_s,nextqa_0_30_s,perceptiontest_0_30_s,youtube_0_30_s,academic_1_2_m,activitynetqa_1_2_m,nextqa_1_2_m,youtube_1_2_m,academic_2_3_m,activitynetqa_2_3_m,nextqa_2_3_m,youtube_2_3_m,academic_30_60_s,activitynetqa_30_60_s,nextqa_30_60_s,perceptiontest_30_60_s,youtube_30_60_s,academic_0_30_s,academic_mc_0_30_s,nextqa_mc_0_30_s,youtube_mc_0_30_s,academic_mc_1_2_m,nextqa_mc_1_2_m,youtube_mc_1_2_m,academic_mc_2_3_m,nextqa_mc_2_3_m,youtube_mc_2_3_m,academic_mc_30_60_s,nextqa_mc_30_60_s,youtube_mc_30_60_s,cambrian_s_3m,cambrian_10m,vsi_590k,vsi_590k_spatial,llava_hound
    eval_dataset: null
    per_device_batch_size: 4
    model_max_length: 4608
    max_pixels: 307200
    min_pixels: 784
    video_max_frame_pixels: 65536
    video_min_frame_pixels: 784
    base_interval: 2
