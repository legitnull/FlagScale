defaults:
  - _self_
  - train: qwen3_5_gr00t_multiimage_event

experiment:
  exp_name: Fs_wm_multiimage_event_two_query_24node
  seed: 42
  save_steps: 10000
  load: null
  exp_dir: outputs/${experiment.exp_name}
  ckpt_format: torch
  task:
    type: train
    backend: native
    entrypoint: flagscale/train/train_qwen3_5_gr00t.py
  runner:
    per_node_task: false
    no_shared_fs: false
    rdzv_backend: static
    hostfile: /share/project/mycao/wm_exp/hostfile.24
  cmds:
    before_start: >-
      pkill -f torchrun || true ;
      pkill -f "flagscale/train" || true ;
      ulimit -n 1048576 ;
      export PATH=/share/project/zhangqq/envs_conda/flagscale-robo/bin:$PATH ;
      export CONDA_PREFIX=/share/project/zhangqq/envs_conda/flagscale-robo
  envs:
    LOGLEVEL: "INFO"
    CUDA_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
    CUDA_DEVICE_MAX_CONNECTIONS: 1
    WANDB_MODE: offline
    OTEL_SDK_DISABLED: true
    NCCL_IB_DISABLE: 0
    GLOO_SOCKET_IFNAME: eth0
    NCCL_SOCKET_IFNAME: eth0
    NCCL_IB_HCA: mlx5_100,mlx5_101,mlx5_102,mlx5_103,mlx5_104,mlx5_105,mlx5_106,mlx5_107
    NCCL_IB_GID_INDEX: 7
    NCCL_DEBUG: INFO
    NCCL_DEBUG_SUBSYS: INIT,NET,GRAPH,ENV
    TORCH_NCCL_TRACE_BUFFER_SIZE: 1048576
    TORCH_NCCL_DUMP_ON_TIMEOUT: 1
    TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC: 3600
    NCCL_TIMEOUT: 3600
    LIBAV_LOG_LEVEL: 0
    AV_LOG_LEVEL: quiet
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
    LD_PRELOAD: "/share/project/lyx/miniconda3/envs/starVLA/lib/libstdc++.so.6"
    LD_LIBRARY_PATH: "/share/project/lyx/miniconda3/envs/starVLA/lib:/usr/local/cuda-12.4/lib64:/usr/local/lib:/usr/local/mpi/lib:/usr/local/mpi/lib64:/usr/local/nvidia/lib:/usr/local/nvidia/lib64"

action: run

hydra:
  run:
    dir: ${experiment.exp_dir}/hydra
