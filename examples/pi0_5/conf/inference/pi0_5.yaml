engine:
  # Model variant: "pi0" or "pi0.5"
  model_variant: "pi0.5"
  model: /workspace/models/lerobot/pi05_pick_bottle
  tokenizer: /workspace/models/google/paligemma-3b-pt-224
  # TODO: (yupu) Use the stat safetensors
  stat_path: /workspace/models/lerobot/pi05_pick_bottle/stats.json
  device: "cuda"
  # Model dtype: "float32" or "bfloat16"
  dtype: "bfloat16"
  # By default, Pi0.5 uses quantiles for state and action normalization, if false, it uses mean and std instead
  use_quantiles: true
  # Enable torch.compile for faster inference (default: false)
  compile: false
  # Compile mode: "default", "reduce-overhead", "max-autotune" (default: "default")
  compile_mode: "max-autotune"
  # Enable TF32 matmul precision (default: false)
  tf32: false

generate:
  images:
    observation.images.base_0_rgb: /share/project/fengyupu/github/fs5/inference_inputs/pick_bottle/zeros_224.png
    observation.images.left_wrist_0_rgb: /share/project/fengyupu/github/fs5/inference_inputs/pick_bottle/img.png
    observation.images.right_wrist_0_rgb: /share/project/fengyupu/github/fs5/inference_inputs/pick_bottle/zeros_224.png
  state_path: /share/project/fengyupu/github/fs5/inference_inputs/pick_bottle/state.pt
  task_path: /share/project/fengyupu/github/fs5/inference_inputs/pick_bottle/task.txt
  rename_map: {}
